# Every label this repository uses, with its color and description.
# scripts/seed_design_questions.py creates or updates them on GitHub, and
# scripts/validate.py checks that the descriptions of the area labels match
# the territory list in START-HERE.md Step 3, in the same order. Keep every
# entry in this shape: a "- name:" line followed by indented color and
# description lines, each value in double quotes.

# Types
- name: "domain-input"
  color: "0E8A16"
  description: "How a company actually handles a situation"
- name: "gap"
  color: "D93F0B"
  description: "Something the decisions do not cover"
- name: "decision-question"
  color: "1D76DB"
  description: "A question about an existing decision"
- name: "proposal"
  color: "5319E7"
  description: "A proposed new or changed decision"
- name: "onboarding"
  color: "FBCA04"
  description: "Feedback about the contribution process itself"
- name: "open-question"
  color: "006B75"
  description: "A design question waiting for answers"

# Progress
- name: "has-answer"
  color: "C2E0C6"
  description: "At least one answer has been posted"
- name: "answered"
  color: "1A7F37"
  description: "The answers are enough to record a decision"

